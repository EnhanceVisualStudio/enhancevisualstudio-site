name = "enhance-visual-studio-inquiries"
main = "inquiry.mjs"
compatibility_date = "2026-11-16"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = false

[observability.traces]
enabled = true
head_sampling_rate = 0.01

[vars]
ALLOWED_ORIGINS = "https://www.enhancevisualstudio.com,https://enhancevisualstudio.com"

[[send_email]]
name = "EMAIL"
destination_address = "hello@enhancevisualstudio.com"

[[ratelimits]]
name = "INQUIRY_LIMITER"
namespace_id = "49127531"

[ratelimits.simple]
limit = 6
period = 60

[env.preview]
name = "enhance-visual-studio-inquiries-preview"
workers_dev = false
preview_urls = false

[env.preview.observability]
enabled = true

[env.preview.observability.logs]
enabled = true
invocation_logs = false

[env.preview.observability.traces]
enabled = true
head_sampling_rate = 0.01

[env.preview.vars]
ALLOWED_ORIGINS = "https://codex-evs-redesign.enhancevisualstudio-site.pages.dev"

[[env.preview.send_email]]
name = "EMAIL"
destination_address = "hello@enhancevisualstudio.com"

[[env.preview.ratelimits]]
name = "INQUIRY_LIMITER"
namespace_id = "49127532"

[env.preview.ratelimits.simple]
limit = 6
period = 60
